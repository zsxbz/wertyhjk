{% extends "base.html" %}

{% block title %}Bot Hosting{% endblock %}

{% block content %}

<div class="home">

    <h1>Bot Hosting Panel</h1>

    <p>
        Discord Bot をブラウザから管理できるホスティングパネルです。
    </p>

    <div class="login-box">

        <form action="/dashboard" method="get">

            <input
                type="text"
                name="token"
                placeholder="アクセストークン"
                required
            >

            <button type="submit">
                ダッシュボードへ
            </button>

        </form>

    </div>

    <div class="features">

        <div class="card">
            <h3>📁 ファイル管理</h3>
            <p>ブラウザから編集できます。</p>
        </div>

        <div class="card">
            <h3>▶ Bot起動</h3>
            <p>起動・停止・再起動に対応。</p>
        </div>

        <div class="card">
            <h3>📜 ログ</h3>
            <p>実行ログを確認できます。</p>
        </div>

        <div class="card">
            <h3>📦 ZIP</h3>
            <p>ダウンロード・アップロード対応。</p>
        </div>

    </div>

</div>

{% endblock %}
