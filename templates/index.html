<!DOCTYPE html>
<html>
<head>

<meta charset="utf-8">

<title>MyVPS Panel</title>

<style>

body{
    font-family:Arial;
    margin:20px;
    background:#202020;
    color:white;
}

.box{
    background:#303030;
    padding:15px;
    margin-bottom:15px;
    border-radius:8px;
}

button{
    margin:3px;
    padding:8px;
}

#files div{
    padding:5px;
}

.folder{
    color:#7ec8ff;
    cursor:pointer;
}

.file{
    color:white;
    cursor:pointer;
}

#drop{
    border:2px dashed gray;
    padding:30px;
    text-align:center;
}

textarea{
    width:100%;
    height:400px;
    background:#111;
    color:white;
}

pre{
    background:#111;
    padding:10px;
    height:250px;
    overflow:auto;
}

</style>

</head>


<body>


<h1>My VPS Panel</h1>


<div class="box">

CPU:
<span id="cpu">0</span>%


<br>

RAM:
<span id="ram">0</span>%


</div>



<div class="box">

<h2>Servers</h2>

<div id="servers">

</div>


</div>



<div class="box">


<h2>Files</h2>

現在:
<span id="path"></span>


<br><br>


<button onclick="back()">
戻る
</button>


<div id="files"></div>



<div id="drop">

ここにファイルをドラッグ&ドロップ

</div>


</div>



<div class="box">


<h2>Editor</h2>


<textarea id="editor"></textarea>

<br>

<button onclick="save()">
保存
</button>


</div>




<div class="box">


<h2>Log</h2>


<select id="logserver"
onchange="loadLog()">

</select>


<pre id="log"></pre>


</div>


<script src="/static/script.js"></script>



</body>

</html>
